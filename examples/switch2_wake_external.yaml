esphome:
  name: switch2_wake_sender

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source:
      type: git
      url: https://github.com/tv/switch2-wake-up
    components: [switch2_wake]

logger:
api:
ota:
  - platform: esphome

esp32_ble:
  id: esp32_ble_id

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

switch2_wake:
  id: switch2_wake_component
  ble_id: esp32_ble_id
  duration: 2000ms
  packet_count: 500

button:
  - platform: switch2_wake
    name: "Switch2 Wake Burst"
    switch2_wake_id: switch2_wake_component
